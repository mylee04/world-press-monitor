name: WPM Hourly Report

on:
  workflow_run:
    workflows:
      - WPM Hourly Ingest
    branches:
      - develop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discord:
    name: Discord Hourly Report
    if: github.event_name == 'workflow_dispatch' || (vars.WPM_DB_JOBS_ENABLED == 'true' && github.event.workflow_run.conclusion != 'cancelled')
    concurrency:
      group: wpm-hourly-discord
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build 3-day RSS failure report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[rss-failure-3d] DATABASE_URL is not set; skipping 3-day report."
            exit 0
          fi
          bun run rss:failure:3d:report

      - name: Apply 3-day RSS failure disable policy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[rss-failure-3d] DATABASE_URL is not set; skipping 3-day apply."
            exit 0
          fi
          bun run rss:failure:3d:apply

      - name: Commit atlas updates (if changed)
        run: |
          if git diff --quiet -- data/rss-atlas.json; then
            echo "[rss-failure-3d] No atlas changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rss-atlas.json
          git commit -m "chore: auto-disable sustained failing RSS feeds (3d policy)"
          git push origin HEAD:develop

      - name: Run hourly ingest report and post to Discord
        run: bun run ingest:ops:hourly --hours=1 --write-json --discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}

      - name: Send hourly country report to Discord
        run: bun run news:country:discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}
          NEWS_COUNTRY_REPORT_EXCLUDED_COUNTRIES: "Global Energy & Grid, Egypt, Singapore, Ukraine, Nigeria, South Africa, Qatar"
