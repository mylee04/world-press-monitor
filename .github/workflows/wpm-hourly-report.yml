name: WPM Hourly Report

on:
  workflow_run:
    workflows:
      - WPM Hourly Ingest
    branches:
      - develop
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord:
    name: Discord Hourly Report
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != 'cancelled'
    concurrency:
      group: wpm-hourly-discord
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run hourly ingest report and post to Discord
        run: bun run ingest:ops:hourly --hours=1 --write-json --discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}

      - name: Send hourly country report to Discord
        run: bun run news:country:discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}
          NEWS_COUNTRY_REPORT_EXCLUDED_COUNTRIES: "Global Energy & Grid, Egypt, Singapore, Ukraine, Nigeria, South Africa, Qatar"
