name: Preflight Typecheck

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  typecheck:
    name: Typecheck (preflight)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run preflight
