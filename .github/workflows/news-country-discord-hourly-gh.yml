name: WPM Hourly Discord Country Report

on:
  schedule:
    # Every hour at minute 30.
    # GitHub Actions cron is UTC-based. For every-hour jobs, minute-only schedules keep the same local minute.
    - cron: "30 * * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate required env vars
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL is not set"
            exit 1
          fi
          if [ -z "${WPM_HOURLY_DISCORD_WEBHOOK}" ]; then
            echo "::error::WPM_HOURLY_DISCORD_WEBHOOK is not set"
            exit 1
          fi
          echo "All required env vars are present."
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}

      - name: Send hourly Discord country intake
        run: bun run news:country:discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}
          NEWS_COUNTRY_REPORT_EXCLUDED_COUNTRIES: "Global Energy & Grid, Egypt, Singapore, Ukraine, Nigeria, South Africa, Qatar"
