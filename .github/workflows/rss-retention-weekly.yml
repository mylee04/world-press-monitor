name: RSS Retention Weekly

on:
  schedule:
    # Weekly at Sunday 00:30 America/Chicago equivalent using UTC cron (06:30 UTC in CST and 07:30 UTC in CDT).
    # GitHub Actions cron itself is UTC-based.
    - cron: "30 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    name: Prune old ingestion artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run weekly retention cleanup
        env:
          INGEST_RETENTION_TZ: America/Chicago
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[ingest-retention] DATABASE_URL is not set; skipping retention."
            exit 0
          fi
          bun run ingest:retention

      - name: Upload retention artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-retention-artifacts-${{ github.run_id }}
          path: |
            audits/ingest_retention_latest.json
            audits/ingest_retention_*.json
          if-no-files-found: ignore
