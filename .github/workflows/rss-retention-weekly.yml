name: RSS Retention Every 3 Days

on:
  schedule:
    # Every 3 days at 00:30 America/Chicago equivalent using UTC cron.
    # GitHub Actions cron itself is UTC-based.
    # Note: this is configured as every 3rd day of the month at 06:30 UTC.
    - cron: "30 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    name: Prune old ingestion artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run retention cleanup
        env:
          NEWS_ARTICLES_RETENTION_DAYS: 3
          INGEST_RETENTION_TZ: America/Chicago
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[ingest-retention] DATABASE_URL is not set; skipping retention."
            exit 0
          fi
          bun run ingest:retention

      - name: Upload retention artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-retention-artifacts-${{ github.run_id }}
          path: |
            audits/ingest_retention_latest.json
            audits/ingest_retention_*.json
          if-no-files-found: ignore
