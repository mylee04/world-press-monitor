name: WPM Weekly Ingest Report

on:
  schedule:
    # Weekly at Sunday 10:00 AM CST = 16:00 UTC.
    # Note: If you want daylight-aware local behavior, adjust the UTC minute during DST periods.
    - cron: "0 16 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-discord:
    name: Discord Weekly Report
    concurrency:
      group: wpm-weekly-discord
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run weekly ingest report and post to Discord
        run: bun run ingest:ops:weekly --write-json --discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}
