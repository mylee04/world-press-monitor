name: RSS Retention Daily

on:
  schedule:
    # Run every day around 10:00 America/Chicago.
    # GitHub Actions cron itself is UTC-based, so run both potential UTC offsets.
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retention:
    name: Prune old ingestion artifacts
    if: github.event_name == 'workflow_dispatch' || vars.WPM_DB_JOBS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run retention cleanup
        env:
          NEWS_ARTICLES_RETENTION_DAYS: 3
          INGEST_RETENTION_TZ: America/Chicago
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          local_hour="$(TZ=America/Chicago date +'%H')"
          if [ "$local_hour" != "10" ]; then
            echo "[ingest-retention] Not 10:00 America/Chicago local time (current local_hour=$local_hour). Skipping."
            exit 0
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "[ingest-retention] DATABASE_URL is not set; skipping retention."
            exit 0
          fi
          bun run ingest:retention

      - name: Upload retention artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-retention-artifacts-${{ github.run_id }}
          path: |
            audits/ingest_retention_latest.json
            audits/ingest_retention_*.json
          if-no-files-found: ignore
