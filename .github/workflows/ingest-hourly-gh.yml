name: WPM Hourly Ingest

on:
  schedule:
    # Every hour at minute 25.
    # GitHub Actions cron is UTC-based. For every-hour jobs, minute-only schedules keep the same local minute.
    - cron: "25 * * * *"
    # Every hour at minute 30 for Discord reporting.
    # This keeps ingest and notification dispatching separated without a second workflow file.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode for manual dispatch"
        required: false
        type: string
        default: ingest-only
        # Accepted values: ingest-only, report-only

jobs:
  ingest:
    name: Ingest
    if: (github.event_name == 'schedule' && github.event.schedule == '25 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'ingest-only')
    concurrency:
      group: wpm-hourly-ingest
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run hourly ingest
        run: bun run ingest:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  discord:
    name: Discord Hourly Report
    if: (github.event_name == 'schedule' && github.event.schedule == '30 * * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'report-only')
    concurrency:
      group: wpm-hourly-discord
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run hourly ingest report and post to Discord
        run: bun run ingest:ops:hourly --hours=1 --write-json --discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}

      - name: Send hourly country report to Discord
        run: bun run news:country:discord
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WPM_HOURLY_DISCORD_WEBHOOK: ${{ secrets.WPM_HOURLY_DISCORD_WEBHOOK }}
          NEWS_COUNTRY_REPORT_EXCLUDED_COUNTRIES: "Global Energy & Grid, Egypt, Singapore, Ukraine, Nigeria, South Africa, Qatar"
