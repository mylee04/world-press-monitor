name: WPM Hourly Ingest

on:
  schedule:
    # Every hour at minute 25.
    # GitHub Actions cron is UTC-based. For every-hour jobs, minute-only schedules keep the same local minute.
    - cron: "25 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run hourly ingest
        run: bun run ingest:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
