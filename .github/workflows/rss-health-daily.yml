name: RSS Health Daily

on:
  schedule:
    # Runs at 00:30 America/Chicago.
    # GitHub Actions schedules are UTC; 06:30 UTC maps to 00:30 CST and 01:30 CDT.
    # (GitHub cron has no per-workflow timezone config.)
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run RSS health pipeline
        env:
          RSS_HEALTH_TZ: America/Chicago
          RSS_HEALTH_DISCORD_WEBHOOK_URL: ${{ secrets.RSS_HEALTH_DISCORD_WEBHOOK_URL }}
          RSS_HEALTH_DISCORD_MENTION: ${{ secrets.RSS_HEALTH_DISCORD_MENTION }}
          RSS_HEALTH_DISCORD_USERNAME: ${{ secrets.RSS_HEALTH_DISCORD_USERNAME }}
          RSS_HEALTH_DISCORD_TIMEOUT_MS: ${{ secrets.RSS_HEALTH_DISCORD_TIMEOUT_MS }}
        run: bun run rss:health:daily

      - name: Run RSS stability daily
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[rss-stability] DATABASE_URL is not set; skipping stability daily."
            exit 0
          fi
          bun run ingest:rss-stability:daily

      - name: Build RSS failure watchlist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "[rss-failure-watchlist] DATABASE_URL is not set; skipping watchlist."
            exit 0
          fi
          bun run rss:failure:watchlist

      - name: Upload health artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rss-health-artifacts-${{ github.run_id }}
          path: |
            audits/readme_rss_health_latest.json
            audits/readme_rss_health_*.json
            audits/rss_feed_stability_latest.json
            audits/rss_feed_stability_*.json
            audits/rss_failure_watchlist_latest.json
            audits/rss_failure_watchlist_latest.md
            data/rss-catalog.csv
            data/rss-catalog.opml
            README.md
          if-no-files-found: ignore
