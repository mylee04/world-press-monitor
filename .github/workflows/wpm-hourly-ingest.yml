name: WPM Hourly Ingest

on:
  schedule:
    # Every hour at minute 25 (UTC for GitHub Actions).
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    name: Ingest
    concurrency:
      group: wpm-hourly-ingest
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run hourly ingest
        run: bun run ingest:once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
