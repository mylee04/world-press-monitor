services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: 512mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: "${WPR_DATABASE_NAME:-wpr}"
    ports:
      - "${WPR_PG_PORT:-5432}:5432"
    volumes:
      - "${WPR_PGDATA_DIR:-./postgres}:/var/lib/postgresql/data"
      # Applied automatically on first boot (when the data volume is empty).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
